server.port=8081
spring.application.name=expense-tracking

spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=27017
spring.data.mongodb.database=expense_tracking

ai.api.key=${AI_API_KEY}
# Modelo Gemini usado na extração (ex.: gemini-2.5-flash, gemini-2.5-flash-lite)
ai.model=${AI_MODEL:gemini-2.5-flash}
# Orçamento de "thinking": 0 desliga (mais rápido); -1 não envia a config (usa o padrão do modelo)
ai.thinking-budget=${AI_THINKING_BUDGET:0}

# Aumentando o limite de tamanho para upload de arquivos (comprovantes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
