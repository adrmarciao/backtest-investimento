version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: backtest-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backtest-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_HOST=mongodb
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backtest-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8080
    depends_on:
      - backend

volumes:
  mongo_data:
